[project]
name = "noauthbot"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "gradio==6.31.0",
    "onnxruntime==1.31.1",
]

[project.scripts]
noauthbot = "app.app:main"

[dependency-groups]
train = [
    "orjson>=3.10",
    "pyyaml>=6.0",
    "safetensors>=0.8",
    "zstandard>=0.23",
    "torch==2.15.0",
    "timm==1.0.31",
    "triton-windows>=3.9,<3.10 ; sys_platform == 'win32'",
]
onnx = ["onnx==1.23.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noauthbot", "app"]

[tool.uv]
default-groups = ["train"]

[tool.uv.sources]
torch = { index = "pytorch-cu134" }

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
