name: full
seed: 0
samples: 16000000
eval_every: 500000

model:
  backbone: mambaout_kobe.in1k
  neck: fpn
  neck_channels: 64
  amb_trunk_grad: 0.1
  sym_depths: [1, 2, 3, 4, 6, 8, 12, 16]
  sym_dim: 16

loss:
  star: 0.5
  amb: 0.25
  sym: 0.1

optim:
  batch: 16
  lr: 4.0e-4
  backbone_lr_mult: 0.5
  weight_decay: 0.05
  warmup: 1000
  decay: 0.2
  ema: 0.999

data:
  train: train
  pools:
    - set: train_amb
      frac: 0.15
  val: val_sub
  workers: 4
